name: "2. Execute Pipeline (Step 1 & 2)"
on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'   # 01:00 UTC (02:00 CET / 03:00 CEST)

permissions:
  contents: write

jobs:
  # One pooled model ranks all stocks against each other, so Step 1 runs on a single runner
  step1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Execute Step 1 Model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: uv run --locked python scripts/02_run_step1.py

      - name: Upload Step 1 State Artifact
        uses: actions/upload-artifact@v7
        with:
          name: step1-state
          path: |
            data/state/step1_passed.csv
          retention-days: 7

      # Every uploaded file must stay under outputs/, so that the artifact root is outputs/
      # (the model summary is outputs/diagnostics/step1_model_summary.json)
      - name: Upload Step 1 Outputs
        uses: actions/upload-artifact@v7
        with:
          name: step1-outputs
          path: |
            outputs/predictions/
            outputs/diagnostics/
          retention-days: 7

  step2-matrix:
    needs: step1
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Download Step 1 State Artifact
        uses: actions/download-artifact@v8
        with:
          name: step1-state
          path: data/state

      - name: Download Step 1 Outputs
        uses: actions/download-artifact@v8
        with:
          name: step1-outputs
          path: outputs

      - name: Execute Step 2 Model
        run: uv run --locked python scripts/03_run_step2.py --shard ${{ matrix.shard }} --total 3

      - name: Upload Final Output Artifact
        uses: actions/upload-artifact@v7
        with:
          name: step2-final-shard-${{ matrix.shard }}
          path: |
            outputs/predictions/
            outputs/diagnostics/
          retention-days: 7

  consolidate-and-commit:
    needs: step2-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Download all Step 2 Shard Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: step2-final-shard-*
          path: step2_artifacts

      - name: Consolidate Shards
        # The artifact root is the common parent of the uploaded paths (outputs/), so payloads
        # arrive as step2_artifacts/<artifact>/predictions/*.json; ** keeps this layout-independent.
        # Every shard carries an identical copy of the Step 1 model summary; the first one is used.
        run: >-
          uv run --locked python scripts/04_consolidate.py
          --predictions-glob 'step2_artifacts/**/predictions/*.json'
          --model-summary-glob 'step2_artifacts/**/diagnostics/step1_model_summary.json'

      - name: Evaluate Uplift Performance
        run: uv run --locked python -m src.processing.uplift_evaluator

      - name: Commit and Push Final Buy Signals
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A also stages archived reports removed by the retention policy
          git add -A -f data/processed/final_buy_signals.csv data/processed/full_batch_report.json data/processed/history/ data/processed/uplift_report.json data/processed/company_profiles_cache.json
          git commit -m "chore: Auto-update final results and JSON batch report" || echo "No changes to commit"
          git pull --rebase --autostash origin main
          git push

  notify:
    needs: [step1, step2-matrix, consolidate-and-commit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify on Success
        if: ${{ needs.consolidate-and-commit.result == 'success' }}
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '@${{ github.repository_owner }} Workflow **${{ github.workflow }}** completed successfully! See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })

      - name: Notify on Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '@${{ github.repository_owner }} Workflow **${{ github.workflow }}** failed! See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })
