[project]
name = "stock-predictor"
version = "2.1.0"
description = "Stock Predictor"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "yfinance==1.7.0",
    "pandas-datareader==0.11.1",
    "requests==2.34.2",
    "pyyaml==6.0.3",
    "tqdm==4.70.1",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "scipy==1.18.1",
    "python-dotenv==1.2.4",
    "google-genai==2.29.0",
    "pydantic==2.14.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Pyflakes and the pycodestyle error rules. Listed explicitly because the default
# rule set changes between ruff releases, which would break CI on version bumps.
select = ["E4", "E7", "E9", "F"]
