[project]
name = "stock-predictor"
version = "3.2.0"
description = "Stock Predictor"
requires-python = ">=3.12"
dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.5",
    "scikit-learn==1.9.1",
    "yfinance==1.8.0",
    "requests==2.34.2",
    "pyyaml==6.0.4",
    "tqdm==4.70.1",
    "python-dotenv==1.2.4",
    "google-genai==3.6.1",
    "pydantic==2.14.4",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
# Pyflakes and the pycodestyle error rules. Listed explicitly because the default
# rule set changes between ruff releases, which would break CI on version bumps.
select = ["E4", "E7", "E9", "F"]
